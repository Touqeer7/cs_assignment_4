<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Campus Portal</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body class="login-page">
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><span class="brand-mark">CP</span><span>Campus Portal<small>IIIT Allahabad</small></span></a></div></header>
<main class="login-main"><section class="login-card"><div class="card-heading"><span class="small-label">CAMPUS ACCOUNT</span><h1>Sign in</h1><p>Welcome back. Enter your account details.</p></div>
<form method="post" action="/login" id="login-form">
<fieldset class="mode-field"><legend>Login mode</legend><div class="mode-options"><label><input type="radio" name="mode" value="vulnerable" checked><span>Vulnerable</span></label><label><input type="radio" name="mode" value="secure"><span>Secured</span></label></div></fieldset>
<label class="field-label" for="username">Username</label><input class="text-input" id="username" name="username" required maxlength="200" autocomplete="off" spellcheck="false" placeholder="Enter username">
<label class="field-label" for="password">Password</label><input class="text-input" id="password" name="password" type="password" required maxlength="200" autocomplete="off" placeholder="Enter password">
<p class="form-error" id="error" role="alert" hidden>Invalid username or password.</p>
<button class="sign-in" type="submit">Sign in <span aria-hidden="true">→</span></button>
</form></section></main><footer class="login-footer">Campus Portal · Web Server Security Assignment</footer>
</body></html>
